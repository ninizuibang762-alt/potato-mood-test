<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fff5dc" />
  <title>测测你是哪种精神状态的土豆</title>
  <style>
    :root{
      --ink:#513621;--brown:#74492d;--cream:#fff8e8;--paper:#fffdf7;
      --yellow:#ffd96a;--orange:#ff8e58;--pink:#ffb8b8;--mint:#aee4bf;
      --blue:#b7dff2;--shadow:0 18px 0 rgba(116,73,45,.10),0 26px 45px rgba(81,54,33,.14);
    }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
    body{background:#fff5dc;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.38;background-image:radial-gradient(#efb369 1.5px,transparent 1.5px);background-size:22px 22px}
    button{font:inherit;color:inherit}
    .app{min-height:100vh;display:grid;place-items:center;padding:30px 18px 46px;position:relative}
    .blob{position:fixed;border-radius:50%;filter:blur(1px);opacity:.45;pointer-events:none}
    .blob.one{width:290px;height:290px;background:#ffd1c7;left:-100px;top:-80px}.blob.two{width:250px;height:250px;background:#bde7cb;right:-90px;bottom:-70px}
    .shell{width:min(760px,100%);position:relative;z-index:1}
    .screen{display:none}.screen.active{display:block;animation:pop .5s cubic-bezier(.2,.8,.2,1)}
    @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
    .card{background:rgba(255,253,247,.95);border:3px solid var(--brown);border-radius:34px;box-shadow:var(--shadow);overflow:hidden;position:relative}
    .stitch{position:absolute;inset:10px;border:2px dashed rgba(116,73,45,.22);border-radius:25px;pointer-events:none}
    .hero{padding:38px 32px 34px;text-align:center}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;background:#fff0b9;border:2px solid var(--brown);border-radius:999px;padding:8px 14px;font-weight:900;font-size:14px;transform:rotate(-2deg)}
    h1{font-size:clamp(34px,7vw,64px);line-height:1.06;margin:20px auto 10px;max-width:650px;letter-spacing:-2px;text-shadow:3px 4px 0 #ffd8a3}
    .hero-sub{font-size:19px;font-weight:800;margin:0 0 8px}.hero-note{font-size:14px;line-height:1.8;color:#80634e;margin:0 auto 18px}
    .hero-potato{width:245px;height:205px;margin:2px auto 8px;filter:drop-shadow(0 12px 0 rgba(116,73,45,.12))}
    .primary,.secondary{border:3px solid var(--brown);border-radius:18px;cursor:pointer;font-weight:950;transition:.18s transform,.18s box-shadow,.18s background}
    .primary{background:var(--orange);color:#fff;padding:15px 28px;box-shadow:0 7px 0 var(--brown);font-size:18px}.primary:hover{transform:translateY(-2px);box-shadow:0 9px 0 var(--brown)}.primary:active{transform:translateY(5px);box-shadow:0 2px 0 var(--brown)}
    .quiz{padding:26px}.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}.count{font-weight:950;font-size:18px}.status{font-size:13px;color:#80634e;font-weight:800;text-align:right}
    .progress{height:13px;background:#f3e3c4;border:2px solid var(--brown);border-radius:999px;overflow:hidden;margin-bottom:24px}.bar{height:100%;width:6.25%;background:linear-gradient(90deg,#ffac6b,#ff6e61);transition:width .38s ease;border-radius:inherit}
    .question{font-size:clamp(23px,4.5vw,33px);line-height:1.35;margin:6px 0 24px;letter-spacing:-.6px}
    .options{display:grid;gap:13px}.option{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:13px;width:100%;padding:15px 17px;background:#fff;border:2.5px solid #9d7656;border-radius:19px;text-align:left;cursor:pointer;font-weight:750;line-height:1.55;box-shadow:0 4px 0 #e5caa8;transition:.17s}.option:hover{background:#fff5cf;transform:translateX(4px);border-color:var(--brown)}.option:active{transform:translateY(3px);box-shadow:0 1px 0 #e5caa8}.letter{width:38px;height:38px;border:2px solid var(--brown);border-radius:13px;background:#ffdc7c;display:grid;place-items:center;font-weight:1000}
    .mini-potato{position:absolute;right:16px;bottom:9px;width:80px;opacity:.13;transform:rotate(-10deg);pointer-events:none}
    .result-wrap{padding:22px}.result-card{padding:28px 28px 24px;background:#fffdf7;border:3px solid var(--brown);border-radius:31px;box-shadow:var(--shadow);position:relative;overflow:hidden}.result-card:before{content:"";position:absolute;inset:10px;border:2px dashed rgba(116,73,45,.2);border-radius:23px;pointer-events:none}
    .result-title{text-align:center;font-weight:1000;font-size:19px;color:#b36037;margin-bottom:3px}.result-grid{display:grid;grid-template-columns:240px 1fr;gap:22px;align-items:center}.result-art{width:225px;height:225px;margin:auto;filter:drop-shadow(0 10px 0 rgba(116,73,45,.11))}.you-are{font-size:16px;font-weight:900;color:#8b6a50}.result-name{font-size:clamp(34px,6vw,50px);line-height:1.05;margin:5px 0 10px;letter-spacing:-1px}.rating{display:inline-block;background:#fff0b9;border:2px solid var(--brown);border-radius:999px;padding:7px 12px;font-weight:900;font-size:14px}.desc{font-weight:650;line-height:1.75;margin:15px 0 0;color:#634a37}
    .result-boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.box{border:2px solid #9d7656;border-radius:17px;padding:14px 16px;background:#fff7db}.box.quote{background:#ffe1d7}.box h3{font-size:14px;margin:0 0 6px;color:#a85a34}.box p{margin:0;line-height:1.55;font-weight:800;font-size:14px}
    .inspection{margin-top:14px;border:2.5px dashed var(--brown);border-radius:19px;background:#f8f1df;padding:15px 17px}.inspection h3{margin:0 0 9px;font-size:16px}.inspection-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;font-size:13px;line-height:1.5}.inspection b{color:#a45732}.stamp{position:absolute;right:26px;top:25px;border:3px solid #e05f50;color:#e05f50;border-radius:9px;padding:5px 7px;font-size:11px;font-weight:1000;transform:rotate(9deg);opacity:.8}
    .verdict{text-align:center;font-weight:1000;margin:18px 5px 4px;font-size:15px}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:17px}.secondary{padding:11px 15px;background:#fff;border-width:2px;box-shadow:0 4px 0 #dcc09d;font-size:14px}.secondary:hover{background:#fff1c4;transform:translateY(-2px)}
    .toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);background:#513621;color:#fff;padding:11px 17px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
    .confetti{position:fixed;width:10px;height:16px;top:-20px;border-radius:3px;z-index:4;pointer-events:none;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg)}}
    @media(max-width:650px){.app{padding:15px 11px 34px}.hero{padding:30px 19px 27px}.hero-potato{width:205px;height:170px}h1{letter-spacing:-1px}.quiz{padding:22px 17px}.quiz-top{align-items:flex-start}.status{max-width:150px}.option{grid-template-columns:36px 1fr;padding:13px 12px;gap:10px}.letter{width:34px;height:34px}.result-wrap{padding:6px}.result-card{padding:26px 17px 20px}.result-grid{grid-template-columns:1fr;text-align:center;gap:2px}.result-art{width:190px;height:190px}.result-boxes,.inspection-grid{grid-template-columns:1fr}.stamp{top:18px;right:18px}.desc{text-align:left}.inspection{text-align:left}}
    @media print{body{background:#fff}.blob,.actions,.stitch{display:none}.app{padding:0}.result-wrap{padding:0}.result-card{box-shadow:none}.screen:not(.active){display:none}}
  </style>
</head>
<body>
  <div class="blob one"></div><div class="blob two"></div>
  <main class="app"><div class="shell">
    <section id="home" class="screen active">
      <div class="card hero"><div class="stitch"></div>
        <div class="eyebrow">🥔 土豆研究所 · 非权威鉴定</div>
        <h1>测测你是哪种<br>精神状态的土豆</h1>
        <p class="hero-sub">别担心，每颗土豆都有自己的命运。</p>
        <div id="heroPotato" class="hero-potato"></div>
        <p class="hero-note">16道离谱问题，揭露你的土豆真身。<br>本测试毫无科学依据，但我们对每颗土豆都很认真。</p>
        <button class="primary" id="startBtn">开始测土豆命运 →</button>
      </div>
    </section>
    <section id="quiz" class="screen"><div class="card quiz"><div class="stitch"></div>
      <div class="quiz-top"><div class="count"><span id="qNow">01</span> <small>/ 16</small></div><div class="status" id="statusText">土豆检测中……</div></div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <h2 class="question" id="question"></h2><div class="options" id="options"></div><div id="miniPotato" class="mini-potato"></div>
    </div></section>
    <section id="result" class="screen result-wrap"><article class="result-card" id="resultCard">
      <div class="stamp">鉴定合格<br>APPROVED</div><div class="result-title">🎉 土豆鉴定完成！</div>
      <div class="result-grid"><div id="resultArt" class="result-art"></div><div>
        <div class="you-are">你是：</div><h2 class="result-name" id="resultName"></h2><div class="rating" id="resultRating"></div><p class="desc" id="resultDesc"></p>
      </div></div>
      <div class="result-boxes"><div class="box"><h3>🥄 今日建议</h3><p id="resultAdvice"></p></div><div class="box quote"><h3>💬 人生格言</h3><p id="resultQuote"></p></div></div>
      <div class="inspection"><h3>📋 土豆出厂检验单</h3><div class="inspection-grid" id="inspection"></div></div>
      <p class="verdict">经检测：此土豆精神状态十分美丽，允许继续在人间滚动。</p>
      <div class="actions"><button class="secondary" id="againBtn">↻ 再测一次</button><button class="secondary" id="saveBtn">▣ 保存我的土豆报告</button><button class="secondary" id="shareBtn">✦ 分享给朋友</button></div>
    </article></section>
  </div></main><div class="toast" id="toast"></div>
  <script>
  const C={ink:'#5a3924',skin:'#e8b85f',light:'#f6d781',blush:'#ef9a94'};
  function potatoSVG(type='base'){
    const extras={
      base:`<path d="M72 33c13-15 36-23 54-19 30 7 48 34 44 68-4 35-31 66-68 64-40-2-65-30-62-65 2-22 14-37 32-48z" fill="#e8b85f" stroke="#5a3924" stroke-width="6"/><circle cx="82" cy="70" r="4" fill="#5a3924"/><circle cx="131" cy="66" r="4" fill="#5a3924"/><path d="M91 92q15 13 31-1" fill="none" stroke="#5a3924" stroke-width="5" stroke-linecap="round"/><ellipse cx="74" cy="87" rx="10" ry="5" fill="#ef9a94" opacity=".65"/><ellipse cx="139" cy="84" rx="10" ry="5" fill="#ef9a94" opacity=".65"/><path d="M46 80q-18 7-24 21M163 75q17 2 24 17M72 143l-8 20M137 142l8 20" stroke="#5a3924" stroke-width="6" stroke-linecap="round" fill="none"/>`,
      lie:`<path d="M58 88c4-35 23-57 57-59 35-2 62 24 59 62-3 34-30 53-66 52-38-1-54-22-50-55z" fill="#e8b85f" stroke="#5a3924" stroke-width="6"/><path d="M70 101q35 13 80-2" fill="none" stroke="#5a3924" stroke-width="6" stroke-linecap="round"/><circle cx="91" cy="83" r="4" fill="#5a3924"/><circle cx="137" cy="82" r="4" fill="#5a3924"/><path d="M105 102q10 5 20-1" fill="none" stroke="#5a3924" stroke-width="4" stroke-linecap="round"/><path d="M58 122q-14 2-22-7M163 120q14 4 22-5" stroke="#5a3924" stroke-width="6" stroke-linecap="round"/><rect x="35" y="132" width="145" height="28" rx="12" fill="#f4bfc0" stroke="#5a3924" stroke-width="5"/><path d="M77 140q-5 16-1 20M129 139q6 15 2 21" stroke="#fff" stroke-width="4"/><text x="20" y="35" font-size="24">🔋</text>`,
      angry:`<path d="M68 34c25-18 69-12 88 16 17 26 12 67-15 86-27 19-71 12-89-17-17-27-8-65 16-85z" fill="#e8b85f" stroke="#5a3924" stroke-width="6"/><path d="M77 69l20 8M142 69l-20 8" stroke="#5a3924" stroke-width="6" stroke-linecap="round"/><circle cx="92" cy="83" r="4"/><circle cx="128" cy="83" r="4"/><path d="M98 108q12-10 25 0" fill="none" stroke="#5a3924" stroke-width="5" stroke-linecap="round"/><path d="M55 94q-22 7-27 22M157 94q22 7 27 22" stroke="#5a3924" stroke-width="6" stroke-linecap="round"/><text x="15" y="52" font-size="30">🔥</text><text x="164" y="55" font-size="27">💢</text>`,
      sprout:`<path d="M69 40c22-17 60-15 81 8 23 26 19 69-8 91-28 22-72 16-91-14-18-29-7-65 18-85z" fill="#e8b85f" stroke="#5a3924" stroke-width="6"/><path d="M109 39q-3-23 14-34M112 26Q90 19 89 2q24-2 31 15M117 22q13-17 31-13-4 19-27 21" fill="#8ac77e" stroke="#5a3924" stroke-width="5" stroke-linejoin="round"/><circle cx="86" cy="78" r="4"/><circle cx="132" cy="80" r="4"/><path d="M101 102q9 5 18 0" fill="none" stroke="#5a3924" stroke-width="4" stroke-linecap="round"/><path d="M52 93q-18 0-24-11M154 97q19-2 25-13M78 139l-5 20M136 139l7 19" stroke="#5a3924" stroke-width="6" stroke-linecap="round"/><text x="20" y="50" font-size="22">☁️</text><text x="160" y="48" font-size="22">✨</text>`,
      frozen:`<path d="M69 39c23-17 62-14 83 10 21 25 17 68-10 89-28 22-72 15-91-15-18-28-7-64 18-84z" fill="#e8b85f" stroke="#5a3924" stroke-width="6"/><circle cx="87" cy="80" r="4"/><circle cx="133" cy="80" r="4"/><path d="M103 102h15" stroke="#5a3924" stroke-width="4" stroke-linecap="round"/><path d="M54 95q-15 10-11 25M155 94q14 11 10 25M79 139v19M135 139v19" stroke="#5a3924" stroke-width="6" stroke-linecap="round"/><path d="M66 113q42-12 88 0l-7 22q-37-13-75-1z" fill="#86c7de" stroke="#5a3924" stroke-width="5"/><text x="20" y="45" font-size="24">❄️</text><text x="164" y="80" font-size="22">❄️</text>`,
      mash:`<path d="M57 104c1-27 20-49 51-51 35-2 60 18 63 49 1 8-2 17-7 24 12 7 9 25-7 27H65c-19-2-23-22-8-31-2-6-2-12 0-18z" fill="#e8b85f" stroke="#5a3924" stroke-width="6"/><circle cx="88" cy="92" r="4"/><circle cx="133" cy="92" r="4"/><path d="M99 113q11 6 22 0" fill="none" stroke="#5a3924" stroke-width="4" stroke-linecap="round"/><ellipse cx="76" cy="108" rx="9" ry="5" fill="#ef9a94" opacity=".65"/><ellipse cx="145" cy="108" rx="9" ry="5" fill="#ef9a94" opacity=".65"/><path d="M61 125q-17 2-25 14M158 125q17 0 24 13" stroke="#5a3924" stroke-width="6" stroke-linecap="round"/><path d="M45 151h132l-12 29H60z" fill="#c7dded" stroke="#5a3924" stroke-width="6"/>`,
      gold:`<path d="M70 41c22-18 61-15 82 9 22 26 17 68-10 89-28 22-73 15-91-16-17-28-6-63 19-82z" fill="#f2bf35" stroke="#5a3924" stroke-width="6"/><path d="M83 39L77 12l24 12 15-20 13 21 25-10-9 27" fill="#ffd94f" stroke="#5a3924" stroke-width="5" stroke-linejoin="round"/><circle cx="87" cy="80" r="4"/><circle cx="133" cy="80" r="4"/><path d="M96 99q15 16 31-2" fill="none" stroke="#5a3924" stroke-width="5" stroke-linecap="round"/><path d="M54 95q-19-1-25-14M155 95q20-2 27-14M78 141l-3 18M136 140l6 18" stroke="#5a3924" stroke-width="6" stroke-linecap="round"/><text x="23" y="55" font-size="22">✨</text><text x="163" y="65" font-size="25">✨</text>`
    };
    return `<svg viewBox="0 0 210 190" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${extras[type]||extras.base}</svg>`;
  }
  const questions=[
    ['某天早上，你的闹钟突然开口说话：“求你了，起床吧！”',['把闹钟搂进被窝：“你也辛苦了，再睡会儿。”','“你们闹钟是不是有自己的秘密组织？”','“你一个闹钟凭什么对我的人生指手画脚？”','“行，今天听你的。”结果出门刚好捡到钱。'],['lie','sprout','angry','gold']],
    ['假如你的人生突然出现一个加载界面，你会？',['盯着那个转圈圈的图标，和它一起发呆。','当场崩溃：“怎么连人生都卡了？”','兴奋地研究加载页面有没有隐藏彩蛋。','既然加载不了，那就先去睡一觉。'],['frozen','mash','sprout','lie']],
    ['一只鸽子突然飞到你面前，邀请你加入鸽子秘密组织。',['“你们鸽子自己的事能不能自己解决？”','“等等，你们是不是一直在监视人类？”','“是不是遇到什么困难了？说来听听。”','“啊？”愣了半天才发现鸽子会说话。'],['angry','sprout','mash','frozen']],
    ['你突然发现自己被拉进了一个500人的神秘群聊，所有人都在@你。',['默默崩溃：“我又犯什么事了？”','点开一看，居然是500个人给你发红包。','开启免打扰，世界与我无关。','“到底谁拉我进来的！站出来！”'],['mash','gold','lie','angry']],
    ['你坐公交车睡过站了，醒来发现自己在完全陌生的地方。',['原地站着，等待大脑重新连接服务器。','算了，既来之则安之，找个地方坐会儿。','开始脑补自己误入平行世界的故事。','想哭，但还是默默打开导航。'],['frozen','lie','sprout','mash']],
    ['外星人降临地球，要求你作为人类代表介绍地球文明。',['“来都来了，先带你们吃顿火锅。”','“首先声明，地球的班真的很难上！”','沉默三分钟，然后问：“能换个人吗？”','一本正经介绍：“人类其实是土豆进化来的。”'],['gold','angry','frozen','sprout']],
    ['朋友突然告诉你：“我觉得自己最近像一块废物。”',['“别这么说，你是我见过最可爱的废物。”','“巧了，我也是。要不一起躺会儿？”','“走，带你吃点好吃的，今天我请客。”','想了半天安慰的话，最后憋出一句：“啊……嗯。”'],['mash','lie','gold','frozen']],
    ['你突然获得了24小时隐身能力，你决定？',['潜入猫咪聚会，调查它们究竟在密谋什么。','跑去讨厌的人旁边大喊：“我是你的报应！”','在床上躺一整天，谁也别想找到我。','偷偷帮朋友解决麻烦，深藏功与名。'],['sprout','angry','lie','gold']],
    ['你发现有人把你的人生拍成了一部电视剧。',['“不是！编剧有病吧？为什么老给我安排倒霉剧情！”','看了五分钟，大脑过载，决定暂停缓缓。','兴奋地发现自己竟然是主角，还自带好运光环。','开始疯狂脑补第二季，并且要求增加魔法元素。'],['angry','frozen','gold','sprout']],
    ['你在自动售货机买了一瓶饮料，机器却掉出来两瓶。',['“发财了！我果然是天选之人！”','找个地方坐下，慢慢喝，主打一个悠闲。','多出来的那瓶送给朋友，快乐翻倍。','对着机器质问：“你是不是看不起我？！”'],['gold','lie','mash','angry']],
    ['假如你今天必须给自己颁一个奖，你会选择？',['最佳精神出走奖：人还在，脑子已飞出太阳系。','年度顽强土豆奖：碎了八百次还能继续生活。','最佳系统故障奖：每天都有一段时间不在线。','年度莫名好运奖：虽然不聪明，但总能混过去。'],['sprout','mash','frozen','gold']],
    ['电梯里一个陌生人突然问你：“请问你真的是人类吗？”',['“不是，我是一颗快要下班的土豆。”','“你礼貌吗？你才不是人类！”','神秘一笑：“既然被你发现了，那就没办法了。”','“啊？”直到电梯门关上还没反应过来。'],['lie','angry','sprout','frozen']],
    ['朋友突然取消了今天的聚会，你的第一反应是？',['“没关系！你是不是不舒服？要好好休息哦。”','出门买零食庆祝，结果意外抽中一等奖。','“好耶！”瞬间钻回被窝。','“等等……是不是有什么惊天阴谋？”'],['mash','gold','lie','sprout']],

  const results={
    lie:{name:'躺平土豆',rating:'低功耗休眠型',desc:'你是一颗典型的躺平土豆。你的人生信条是：只要我不主动崩溃，崩溃就追不上我。你表面平静，内心其实已经把一周的活推迟到下周了。',advice:'别给自己太大压力，先活过今天再说。',quote:'“不是我不努力，是我正在节能模式中。”',id:'TD-001',danger:'★★☆☆☆',behavior:'发呆、躺着、推迟一切不紧急事务',env:'被窝、沙发、窗边、周末',ban:'周一早八、突然加班、连续开会'},

    frozen:{name:'冷冻土豆',rating:'延迟加载型',desc:'你像一颗刚从冰箱里拿出来的冷冻土豆，不是不想动，是还没解冻完成。遇到事情你常常先愣住，过一会儿才说：啊？刚刚发生什么了？',advice:'没关系，脑子慢一点也不是坏事。',quote:'“稍等，我的脑子正在加载。”',id:'TD-004',danger:'★★☆☆☆',behavior:'延迟反应、缓慢启动、发愣',env:'空调房、清晨、安静角落',ban:'突然点名、临时发言、连续追问'},

  const status=['土豆检测中……','正在扫描你的精神状态……','锅里翻面中，请稍候……','正在分析你的土豆脑回路……','土豆研究所正在出结果……','正在判断你是否适合继续在人间滚动……'];
  let index=0,scores={},recent=[]; Object.keys(results).forEach(k=>scores[k]=0);
  const $=s=>document.querySelector(s); $('#heroPotato').innerHTML=potatoSVG('base'); $('#miniPotato').innerHTML=potatoSVG('base');
  function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
  function start(){index=0;recent=[];Object.keys(scores).forEach(k=>scores[k]=0);show('quiz');renderQuestion()}
  function renderQuestion(){const q=questions[index];$('#qNow').textContent=String(index+1).padStart(2,'0');$('#bar').style.width=((index+1)/16*100)+'%';$('#statusText').textContent=status[index%status.length];$('#question').textContent=q[0];$('#options').innerHTML=q[1].map((o,i)=>`<button class="option" data-i="${i}"><span class="letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}
  function answer(i){const type=questions[index][2][i];scores[type]++;if(index>=10)recent.push(type);index++;if(index<questions.length)renderQuestion();else finish()}
  function winner(){let max=Math.max(...Object.values(scores)),ties=Object.keys(scores).filter(k=>scores[k]===max);if(ties.length>1){let rc={};ties.forEach(k=>rc[k]=recent.filter(x=>x===k).length);let rmax=Math.max(...Object.values(rc));ties=ties.filter(k=>rc[k]===rmax)}const priority=['gold','sprout','lie','mash','frozen','angry'];return priority.find(k=>ties.includes(k))}
  function finish(){const key=winner(),r=results[key];$('#resultArt').innerHTML=potatoSVG(key);$('#resultName').textContent=r.name;$('#resultRating').textContent='精神状态评级：'+r.rating;$('#resultDesc').textContent=r.desc;$('#resultAdvice').textContent=r.advice;$('#resultQuote').textContent=r.quote;$('#inspection').innerHTML=`<div><b>编号：</b>${r.id}</div><div><b>品种：</b>${r.name}</div><div><b>危险等级：</b>${r.danger}</div><div><b>日常行为：</b>${r.behavior}</div><div><b>适合环境：</b>${r.env}</div><div><b>禁止事项：</b>${r.ban}</div>`;show('result');confetti();localStorage.setItem('potato-last',key)}
  function confetti(){const colors=['#ff7b64','#ffd85a','#80ccb0','#8dc9e5','#ef9fc1'];for(let i=0;i<48;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];c.style.animationDelay=Math.random()*.9+'s';c.style.transform=`rotate(${Math.random()*180}deg)`;document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}}
  function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}

  $('#shareBtn').onclick=async()=>{const name=$('#resultName').textContent,text=`我测出来是「${name}」🥔\n经检测，此土豆精神状态十分美丽，允许继续在人间滚动。\n你也来测测：${location.href}`;try{if(navigator.share)await navigator.share({title:'测测你是哪种精神状态的土豆',text,url:location.href});else{await navigator.clipboard.writeText(text);toast('分享文案已复制！')}}catch(e){if(e.name!=='AbortError')toast('截图发给朋友也很有仪式感～')}};
